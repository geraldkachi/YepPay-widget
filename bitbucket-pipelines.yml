# Do not edit
# --------
# You can specify a custom docker image from Docker Hub as your build environment.

image: node:14.14.0

options:
  docker: true
  size: 2x

clone:
  depth: full # SonarCloud scanner needs the full history to assign issues properly

definitions:
  services:
    docker:
      memory: 4096

  caches:
    sonar: ~/.sonar/cache # Caching SonarCloud artifacts will speed up your build

  steps:
    - step: &build-test-sonarcloud
        name: Build, test and analyze on SonarCloud
        caches:
          - node
          - sonar
        script:
          #- mkdir -p src && cd src
          - echo "sonar.sources=./src" > sonar-project.properties
          - echo "sonar.tests=./src" >> sonar-project.properties
          - echo "sonar.testExecutionReportPaths=./test-report.xml" >> sonar-project.properties
          - echo "sonar.javascript.lcov.reportPaths=./coverage/lcov.info" >> sonar-project.properties
          - chmod 755 sonar-project.properties
          - npm ci --quiet
          - npm test -- --coverage=true --passWithNoTests --watchAll=false --no-progress --ci --colors --testResultsProcessor=jest-sonar-reporter
          - pipe: sonarsource/sonarcloud-scan:1.4.0
          - rm -rf sonar-project.properties && cd ..
        services:
          - docker
    - step: &check-quality-gate-sonarcloud
        name: Check the Quality Gate on SonarCloud
        script:
          - pipe: sonarsource/sonarcloud-quality-gate:0.1.6

pipelines:
  branches:
    develop:
      - step: *build-test-sonarcloud
      - step: *check-quality-gate-sonarcloud
    main:
      - step: *build-test-sonarcloud
      - step: *check-quality-gate-sonarcloud

  pull-requests:
    "**":
      - step: *build-test-sonarcloud
      - step: *check-quality-gate-sonarcloud
